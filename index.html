<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gerador de Piadas Aleatórias</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--text:#e6eef8}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#071029 0%,#081426 100%);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    .card{background:var(--card);color:var(--text);padding:2rem;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,.6);max-width:720px;width:92%}
    h1{margin:0 0 1rem;font-size:1.25rem}
    .joke{font-size:1.1rem;line-height:1.6;margin:1rem 0;min-height:3.5rem}
    .meta{font-size:.85rem;color:#9fb3c6;margin-bottom:.75rem}
    .controls{display:flex;gap:.5rem;flex-wrap:wrap}
    button{background:var(--accent);border:0;padding:.6rem .9rem;border-radius:8px;color:#042028;font-weight:600;cursor:pointer}
    button.secondary{background:transparent;border:1px solid rgba(255,255,255,.06);color:var(--text)}
    .small{font-size:.85rem;padding:.45rem .75rem;border-radius:6px}
    .loader{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--text);border-radius:50%;animation:spin .9s linear infinite;vertical-align:middle;margin-left:.5rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    footer{font-size:.8rem;color:#9fb3c6;margin-top:1rem}
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Gerador de Piadas Aleatórias</h1>
    <div class="meta">Fonte: JokeAPI (https://v2.jokeapi.dev)</div>
    <div id="joke" class="joke">Clique em "Nova piada" para começar.</div>
    <div class="controls">
      <button id="newBtn">Nova piada</button>
      <button id="copyBtn" class="secondary small">Copiar</button>
      <button id="tweetBtn" class="secondary small">Compartilhar (Twitter)</button>
      <label style="margin-left:auto;display:flex;gap:.5rem;align-items:center;color:#9fb3c6;font-size:.9rem">
        <input id="nsfwToggle" type="checkbox" /> Mostrar NSFW
      </label>
    </div>
    <footer id="status">Pronto.</footer>
  </main>

  <script>
    const jokeEl = document.getElementById('joke');
    const newBtn = document.getElementById('newBtn');
    const copyBtn = document.getElementById('copyBtn');
    const tweetBtn = document.getElementById('tweetBtn');
    const statusEl = document.getElementById('status');
    const nsfwToggle = document.getElementById('nsfwToggle');

    async function fetchJoke() {
      setLoading(true);
      try {
        const blacklist = nsfwToggle.checked ? '' : 'nsfw,religious,political,sexist,racist';
        const url = `https://v2.jokeapi.dev/joke/Any?blacklistFlags=${encodeURIComponent(blacklist)}&lang=pt&type=single,twopart`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Falha ao buscar a piada: ' + res.status);
        const data = await res.json();

        let text = '';
        if (data.error) {
          throw new Error('API retornou erro.');
        } else if (data.type === 'single') {
          text = data.joke;
        } else if (data.type === 'twopart') {
          text = data.setup + '\n\n' + data.delivery;
        } else {
          text = JSON.stringify(data);
        }

        jokeEl.textContent = text;
        statusEl.textContent = `Categoria: ${data.category} • ID: ${data.id}`;
      } catch (err) {
        jokeEl.textContent = 'Erro ao carregar piada. Tente novamente.';
        statusEl.textContent = err.message;
        console.error(err);
      } finally {
        setLoading(false);
      }
    }

    function setLoading(loading) {
      if (loading) {
        newBtn.disabled = true;
        newBtn.innerHTML = 'Carregando <span class="loader" aria-hidden="true"></span>';
        statusEl.textContent = 'Buscando piada...';
      } else {
        newBtn.disabled = false;
        newBtn.textContent = 'Nova piada';
      }
    }

    newBtn.addEventListener('click', fetchJoke);

    copyBtn.addEventListener('click', async () => {
      const text = jokeEl.textContent.trim();
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        statusEl.textContent = 'Copiado para a área de transferência.';
      } catch {
        statusEl.textContent = 'Não foi possível copiar (navegador bloqueou).';
      }
    });

    tweetBtn.addEventListener('click', () => {
      const text = jokeEl.textContent.trim();
      const max = 280 - 24;
      const tweet = encodeURIComponent(text.length > max ? text.slice(0, max - 1) + '…' : text);
      const url = `https://twitter.com/intent/tweet?text=${tweet}&via=adaptambiental`;
      window.open(url, '_blank', 'noopener');
    });

    // Busca a primeira piada ao carregar
    fetchJoke();
  </script>
</body>
</html>
